services:
  - type: web
    name: ai-tools-navi
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker -w 4 --timeout 120
    envVars:
      - key: SITE_DOMAIN
        value: your-domain.com
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
